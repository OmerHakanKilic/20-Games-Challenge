<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<title>Odin + Raylib on the web</title>
	<meta name="title" content="Odin + Raylib on the web">
	<meta name="description" content="Make games using Odin + Raylib that work in the browser">
	<meta name="viewport" content="width=device-width">

	<style>
		html, body {
			height: 100%;
		}
		body {
			margin: 0px;
			overflow: hidden;
			background-color: black;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		canvas.game_canvas {
			border: 0px none;
			background-color: black;
			image-rendering: pixelated;
		}
	</style>
</head>
<body>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// The game always renders at this fixed internal resolution. The canvas
		// is scaled to fit the viewport with CSS (letterboxed), so it works
		// inside iframes of any size (e.g. itch.io) and on mobile.
		var GAME_WIDTH = 720;
		var GAME_HEIGHT = 480;

		function fit_canvas_to_viewport() {
			var canvas = document.getElementById('canvas');
			var scale = Math.min(
				window.innerWidth / GAME_WIDTH,
				window.innerHeight / GAME_HEIGHT
			);
			// Snap to whole multiples when upscaling for perfectly crisp pixels.
			if (scale > 1) scale = Math.floor(scale);
			canvas.style.width = Math.floor(GAME_WIDTH * scale) + 'px';
			canvas.style.height = Math.floor(GAME_HEIGHT * scale) + 'px';
		}

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			// This happens a bit after `instantiateWasm`, when everything is
			// done setting up. At that point we can run code.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				e._start();

				// See source/main_web/main_web.odin for main_start,
				// main_update and main_end.
				e.main_start();

				// Fit the canvas once raylib has initialized it, and again
				// after layout settles (mobile URL bars, itch.io iframe...).
				fit_canvas_to_viewport();
				window.requestAnimationFrame(fit_canvas_to_viewport);

				window.addEventListener('resize', fit_canvas_to_viewport, true);
				window.addEventListener('orientationchange', fit_canvas_to_viewport);
				if (window.visualViewport) {
					window.visualViewport.addEventListener('resize', fit_canvas_to_viewport);
				}

				// Runs the "main loop".
				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();

						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			print: (function() {
				var element = document.getElementById("output");
				if (element) element.value = ''; // clear browser cache
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
					if (element) {
					  element.value += text + "\n";
					  element.scrollTop = element.scrollHeight; // focus on bottom
					}
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
